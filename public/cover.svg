  <g filter="url(#cardShadow)">
    <!-- Card 1: Dashboard & KPIs -->
    <rect x="520" y="120" width="300" height="92" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="558" cy="154" r="19" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
    <g stroke="#2563EB" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="550" y="146" width="6" height="6" rx="1.5"/>
