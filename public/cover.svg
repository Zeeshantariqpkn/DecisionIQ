<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>DecisionIQ — AI Decision Intelligence Platform</title>
  <desc>Cover banner for DecisionIQ: Transform Data into Confident Decisions. Features: Dashboard &amp; KPIs, AI Chat, Analytics, Executive Summary, Data Sources, Reports, Health Score, Auth &amp; Settings. Tech: React, TypeScript, Vite, Tailwind CSS, Recharts, Supabase.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5FF"/>
    </linearGradient>
    <radialGradient id="glowTR" cx="0.82" cy="0.16" r="0.55">
      <stop offset="0" stop-color="#DBEAFE" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#DBEAFE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBL" cx="0.06" cy="0.98" r="0.45">
      <stop offset="0" stop-color="#E0E7FF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#E0E7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.5"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <filter id="logoShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1E40AF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.35"/>
  <rect width="1200" height="630" fill="url(#glowTR)"/>
  <rect width="1200" height="630" fill="url(#glowBL)"/>
  <rect x="0" y="0" width="6" height="630" fill="url(#edgeGrad)"/>

  <!-- Header -->
  <circle cx="80" cy="64" r="36" fill="#DBEAFE" opacity="0.6"/>
  <g filter="url(#logoShadow)">
    <rect x="56" y="40" width="48" height="48" rx="14" fill="#2563EB"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="66" y="64" width="8" height="12" rx="2.5"/>
    <rect x="78" y="56" width="8" height="20" rx="2.5"/>
    <rect x="90" y="66" width="8" height="10" rx="2.5"/>
  </g>
  <text x="118" y="75" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="30" font-weight="800" fill="#0F172A">Decision<span fill="#2563EB">IQ</span></text>

  <rect x="802" y="42" width="342" height="32" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="973" y="63" text-anchor="middle" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#1D4ED8">AI DECISION INTELLIGENCE PLATFORM</text>

  <!-- Left column -->
  <text x="56" y="196" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="40" font-weight="800" fill="#0F172A">Transform Data into</text>
  <text x="56" y="246" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="40" font-weight="800" fill="url(#titleGrad)">Confident Decisions</text>

  <g font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="15.5" font-weight="500" fill="#475569">
    <text x="56" y="294">DecisionIQ is an AI decision intelligence platform</text>
    <text x="56" y="320">built for CEOs, founders, executives, and analysts.</text>
    <text x="56" y="346">It turns business data into confident, strategic moves.</text>
  </g>

  <text x="56" y="382" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#94A3B8">TECH STACK</text>

  <g font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#334155">
    <rect x="56" y="396" width="58" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="85" y="416.5" text-anchor="middle">React</text>
    <rect x="126" y="396" width="94" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="173" y="416.5" text-anchor="middle">TypeScript</text>
    <rect x="232" y="396" width="52" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="258" y="416.5" text-anchor="middle">Vite</text>

    <rect x="56" y="436" width="108" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="110" y="456.5" text-anchor="middle">Tailwind CSS</text>
    <rect x="176" y="436" width="80" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="216" y="456.5" text-anchor="middle">Recharts</text>
    <rect x="268" y="436" width="80" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="308" y="456.5" text-anchor="middle">Supabase</text>
  </g>

  <text x="56" y="506" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#64748B">Responsive design · Full dark mode · Production-ready MVP</text>

