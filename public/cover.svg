      <rect x="550" y="156" width="6" height="6" rx="1.5"/>
      <rect x="560" y="156" width="6" height="6" rx="1.5"/>
    </g>
    <text x="590" y="148" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Dashboard &amp; KPIs</text>
    <text x="590" y="168" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#64748B">6 KPI cards · 6 charts</text>

    <!-- Card 2: AI Chat -->
    <rect x="844" y="120" width="300" height="92" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="882" cy="154" r="19" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
    <g stroke="#2563EB" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="872" y="146" width="20" height="14" rx="5"/>
      <path d="M876.5 160l-2.5 4.5 4.5-4.5"/>
    </g>
    <circle cx="878" cy="153" r="1.6" fill="#2563EB"/>
    <circle cx="882" cy="153" r="1.6" fill="#2563EB"/>
    <circle cx="886" cy="153" r="1.6" fill="#2563EB"/>
    <text x="914" y="148" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">AI Chat</text>
    <text x="914" y="168" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#64748B">Ask your data anything</text>

