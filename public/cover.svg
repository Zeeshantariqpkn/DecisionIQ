    <rect x="520" y="228" width="300" height="92" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="558" cy="262" r="19" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
    <g stroke="#2563EB" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="550" y="262" width="4" height="8" rx="1"/>
      <rect x="556" y="256" width="4" height="14" rx="1"/>
      <rect x="562" y="260" width="4" height="10" rx="1"/>
      <path d="M547 270h22"/>
    </g>
    <text x="590" y="256" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Analytics</text>
    <text x="590" y="276" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#64748B">Trends · correlations · outliers</text>

