    <rect x="844" y="228" width="300" height="92" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="882" cy="262" r="19" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
    <g stroke="#2563EB" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="873.5" y="253" width="17" height="18" rx="3"/>
      <path d="M877.5 259h9M877.5 263h9M877.5 267h5.5"/>
    </g>
    <text x="914" y="256" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Executive Summary</text>
    <text x="914" y="276" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#64748B">SWOT · recommendations · gauge</text>

    <!-- Card 5: Data Sources -->
    <rect x="520" y="336" width="300" height="92" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="558" cy="370" r="19" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
    <g stroke="#2563EB" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="558" cy="363" rx="9" ry="3.2"/>
      <path d="M549 363v12a9 3.2 0 0 0 18 0v-12"/>
    </g>
    <text x="590" y="364" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Data Sources</text>
    <text x="590" y="384" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#64748B">CSV / XLSX drag &amp; drop</text>

    <!-- Card 6: Reports -->
    <rect x="844" y="336" width="300" height="92" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="882" cy="370" r="19" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
    <g stroke="#2563EB" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="874" y="361" width="16" height="18" rx="2.5"/>
      <path d="M877.5 366h9M877.5 370h9M877.5 374h5.5"/>
    </g>
    <text x="914" y="364" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Reports</text>
    <text x="914" y="384" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#64748B">Preview &amp; download</text>

    <!-- Card 7: Health Score -->
    <rect x="520" y="444" width="300" height="92" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="558" cy="478" r="19" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
    <g stroke="#2563EB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M548 478h4.5l2.5-6 4 12 2.5-6h5"/>
    </g>
    <text x="590" y="472" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Health Score</text>
    <text x="590" y="492" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#64748B">0–100 business gauge</text>

    <!-- Card 8: Auth & Settings -->
    <rect x="844" y="444" width="300" height="92" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="882" cy="478" r="19" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
    <g stroke="#2563EB" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="874.5" y="477" width="15" height="11" rx="2.5"/>
      <path d="M877.5 477v-3.5a4.5 4.5 0 0 1 9 0v3.5"/>
    </g>
    <circle cx="882" cy="482.5" r="1.6" fill="#2563EB"/>
    <text x="914" y="472" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Auth &amp; Settings</text>
    <text x="914" y="492" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#64748B">Login · register · profile</text>
  </g>

  <!-- Bottom stats strip -->
  <line x1="56" y1="566" x2="1144" y2="566" stroke="#E2E8F0" stroke-width="1.5"/>
  <g font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif">
    <text x="200" y="602" text-anchor="middle" font-size="24" font-weight="800" fill="#2563EB">9</text>
    <text x="200" y="622" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1.5" fill="#64748B">PAGES &amp; ROUTES</text>

    <text x="480" y="602" text-anchor="middle" font-size="24" font-weight="800" fill="#2563EB">20+</text>
    <text x="480" y="622" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1.5" fill="#64748B">UI COMPONENTS</text>

    <text x="760" y="602" text-anchor="middle" font-size="24" font-weight="800" fill="#2563EB">6</text>
    <text x="760" y="622" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1.5" fill="#64748B">KPI METRICS</text>

    <text x="1040" y="602" text-anchor="middle" font-size="24" font-weight="800" fill="#2563EB">100%</text>
    <text x="1040" y="622" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="1.5" fill="#64748B">RESPONSIVE</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accentBar)"/>
</svg>
